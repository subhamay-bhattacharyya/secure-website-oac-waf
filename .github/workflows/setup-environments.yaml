name: Setup Environments
run-name: Setup Environments in ${{ github.ref_name }} by ${{ github.actor }}

on:
  workflow_dispatch:

jobs:
  onboard:
    uses: subhamay-bhattacharyya-gha/aws-project-onboarding/.github/workflows/aws-project-onboarding.yaml@main
    secrets:
      TFE_TOKEN: ${{ secrets.TFE_TOKEN_AWS_ORG }}
      TF_VCS_OAUTH_TOKEN_ID: ${{ secrets.TF_VCS_OAUTH_TOKEN_ID_AWS_ORG }}
      GITHUB_PAT: ${{ secrets.GH_PAT }}