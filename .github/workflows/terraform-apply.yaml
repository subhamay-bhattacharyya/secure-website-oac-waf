name: Terraform Apply
run-name: Terraform Apply - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to (e.g., devl, test, prod)"
        required: true
        type: environment
        default: devl


jobs:
  apply:
    name: 🚧 Run Terraform Apply
    uses: subhamay-bhattacharyya-gha/tf-deploy-multi-reusable-wf/.github/workflows/terraform-deploy.yaml@bug/GHA-0027-bug-heredoc-write-of-snow
    with:
      cloud-provider: platform
      tflint-ver: ${{ vars.TF_LINT_VER }}
      backend-type: remote
      tf-vars-file: environments/${{ github.event.inputs.environment }}/terraform.tfvars
    secrets:
      tfc-token: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO_AWS_ORG }}
